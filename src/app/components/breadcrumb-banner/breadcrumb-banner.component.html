<section class="breadcrumb-banner" role="banner" aria-label="Page banner">
  <div class="overlay"></div>

  <div class="container content-wrapper text-center text-white">
    <h1 class="page-title" [attr.aria-label]="'Page title: ' + title">
      {{ title }}
    </h1>

    <p *ngIf="subtitle" class="page-subtitle">
      {{ subtitle }}
    </p>

    <nav *ngIf="showBreadcrumb" aria-label="Breadcrumb">
      <ol class="breadcrumb justify-content-center">
        <li class="breadcrumb-item">
          <a routerLink="/">
            <i class="bi bi-house-door me-1"></i> Home
          </a>
        </li>

        <li class="breadcrumb-item active" aria-current="page">
          {{ title }}
        </li>
      </ol>
    </nav>
  </div>
</section>
