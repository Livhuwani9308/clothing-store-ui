<app-breadcrumb-banner [title]="'Product Details'" [showBreadcrumb]="true"></app-breadcrumb-banner>
<div class="container py-5">
  <div class="row">
    <div class="col-md-6">
      <img [src]="product.imageUrl" class="img-fluid rounded" [alt]="product.name">
    </div>
    <div class="col-md-6">
      <h2>{{ product.name }}</h2>
      <h4>${{ product.price }}</h4>
      <button class="btn btn-warning text-dark" (click)="addToCart()">Add to Cart</button>
    </div>
  </div>
</div>
