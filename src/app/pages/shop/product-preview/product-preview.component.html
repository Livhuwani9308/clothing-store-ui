<div class="shop-bg">
  <div class="container py-5">

    <div class="row g-4">

      <!-- ===== LEFT: IMAGES ===== -->
      <div class="col-lg-6">
        <div class="preview-card">

          <!-- MAIN IMAGE -->
          <div class="main-image">
            <img [src]="selectedImage" alt="product" />
          </div>

          <!-- THUMBNAILS -->
          <div class="thumbs mt-3">
            <img
              *ngFor="let img of product.images"
              [src]="img"
              (click)="selectImage(img)"
              [class.active]="img === selectedImage"
            />
          </div>

        </div>
      </div>

      <!-- ===== RIGHT: PRODUCT INFO ===== -->
      <div class="col-lg-6">

        <div class="product-info">

          <h4 class="title">{{ product.name }}</h4>

          <div class="price-section">
            <span class="price">R {{ product.price }}</span>
            <span *ngIf="product.oldPrice" class="old-price">
              R {{ product.oldPrice }}
            </span>
          </div>

          <!-- COLOR -->
          <div class="option-group">
            <label>Color</label>

            <div class="color-options">
              <div
                class="color-circle"
                *ngFor="let v of product.variants"
                [ngStyle]="{ 'background-color': v.color.name }"
                (click)="selectColor(v.color.name)"
                [class.active]="selectedColor === v.color.name"
              ></div>
            </div>
          </div>

          <!-- SIZE -->
          <div class="option-group">
            <label>Size</label>

            <div class="size-options">
              <button
                *ngFor="let size of product.variants[0].sizes"
                (click)="selectSize(size)"
                [class.active]="selectedSize === size"
              >
                {{ size }}
              </button>
            </div>
          </div>

          <!-- CTA -->
          <button class="btn btn-dark w-100 mt-4">
            ADD TO CART
          </button>

          <!-- DESCRIPTION -->
          <div class="description mt-4">
            <h6>Description</h6>
            <p>
              Premium quality product designed for comfort and style.
              Perfect for everyday wear.
            </p>
          </div>

        </div>

      </div>

    </div>

  </div>
</div>
