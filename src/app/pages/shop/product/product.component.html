<app-breadcrumb-banner
  [title]="categoryTitle"
  [subtitle]="'Browse our premium ' + categoryTitle + ' collection'"
  [showBreadcrumb]="true">
</app-breadcrumb-banner>

<div class="shop-bg">
  <div class="container py-5">

    <div class="row">

      <!-- FILTER SIDEBAR -->
      <div class="col-lg-3 mb-4">
        <div class="filter-card">

          <h5 class="filter-title">Filters</h5>

          <!-- Price Filter -->
          <div class="filter-group">
            <label>Max Price</label>
            <input type="range"
                   min="0"
                   max="5000"
                   [(ngModel)]="maxPrice"
                   (change)="applyFilters()">
            <span>R {{ maxPrice }}</span>
          </div>

          <!-- Size Filter -->
          <div class="filter-group">
            <label>Size</label>
            <div *ngFor="let size of sizes">
              <input type="checkbox"
                     [value]="size"
                     (change)="toggleSize(size)">
              {{ size }}
            </div>
          </div>

          <!-- Color Filter -->
          <div class="filter-group">
            <label>Color</label>
            <div *ngFor="let color of colors">
              <input type="checkbox"
                     [value]="color"
                     (change)="toggleColor(color)">
              {{ color }}
            </div>
          </div>

        </div>
      </div>

      <!-- PRODUCTS GRID -->
      <div class="col-lg-9">
        <div class="row">
          <div class="col-md-4 mb-4"
               *ngFor="let product of filteredProducts">

            <div class="card product-card h-100">

              <div class="card-img-container">
                <img [src]="product.imageUrl"
                     class="card-img-top"
                     [alt]="product.name">
              </div>

              <div class="card-body d-flex flex-column">
                <h6 class="card-title">{{ product.name }}</h6>

                <div class="price-section">
                  <span class="price">R {{ product.price }}</span>
                  <span *ngIf="product.oldPrice"
                        class="old-price">
                    R {{ product.oldPrice }}
                  </span>
                </div>

                <a [routerLink]="['/product', product.id]"
                   class="btn btn-dark mt-auto">
                  View
                </a>
              </div>

            </div>

          </div>
        </div>
      </div>

    </div>

  </div>
</div>
