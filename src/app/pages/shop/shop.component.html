<app-breadcrumb-banner 
  [title]="'Shop Now'" 
  [subtitle]="'Discover our premium collection of men\'s fashion and footwear'"
  [showBreadcrumb]="true">
</app-breadcrumb-banner>

<div class="shop-bg">
  <div class="container py-5">

    <div class="category-grid">
      <div 
        class="category-item"
        *ngFor="let category of categories"
        [routerLink]="['/products', category.id]"
      >
        <div class="image-wrapper">
          <img 
            src="/assets/images/placeholder.jpeg" 
            alt="{{ category.name }}" 
          />
        </div>

        <h6 class="category-title">
          {{ category.name }}
        </h6>
      </div>
    </div>

  </div>
</div>
