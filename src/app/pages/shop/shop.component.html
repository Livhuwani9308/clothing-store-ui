<app-breadcrumb-banner 
  [title]="'Shop Now'" 
  [subtitle]="'Discover our premium collection of men\'s fashion and footwear'"
  [showBreadcrumb]="true">
</app-breadcrumb-banner>

<div class="shop-bg">
  <div class="container py-5">
    <!-- <h2 class="text-warning mb-4">Shop Now</h2> -->
    <div class="row justify-content-center">
      <div class="col-md-3 mb-4" *ngFor="let product of products">
        <div class="card h-100 shadow-sm">
          <div class="card-img-container">
            <img [src]="product.imageUrl" class="card-img-top" [alt]="product.name">
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ product.name }}</h5>
            <span class="text-dark mb-2">R {{ product.price.toFixed(2) }} ZAR</span>
            <a [routerLink]="['/product', product.id]" class="btn btn-sm btn-outline-dark mt-3">View</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
