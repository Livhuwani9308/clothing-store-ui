<header class="header-main">

  <!-- ================= TOP ROW ================= -->
  <div class="header-top">
    <div class="container d-flex align-items-center justify-content-between">

      <!-- Logo -->
      <a routerLink="/" class="logo">
        <!-- <img src="https://livhuwani.sirv.com/MKclothing/logo/logo.jpg" alt="MKclothing Logo" class="brand-logo" /> -->
        <img src="/assets/images/new-logo.png" alt="Logo" />
      </a>

      <!-- Search -->
      <div class="search-wrapper d-none d-lg-flex">
        <input type="text" placeholder="Search products..." />
        <button>
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <!-- Icons -->
      <div class="header-icons d-flex align-items-center gap-3">

        <a routerLink="/login">
          <i class="fa-regular fa-user"></i>
        </a>

        <a routerLink="/wishlist">
          <i class="fa-regular fa-heart"></i>
        </a>

        <a routerLink="/cart" class="cart-icon position-relative">
          <i class="fa-solid fa-bag-shopping"></i>

          <span *ngIf="cartItemCount > 0" class="cart-badge">
            {{ cartItemCount }}
          </span>
        </a>

        <!-- Mobile Toggle -->
        <button
          class="mobile-toggle d-lg-none"
          (click)="toggleMenu()">
          <i class="fa-solid fa-bars"></i>
        </button>

      </div>

    </div>
  </div>


  <!-- ================= CATEGORY ROW ================= -->
  <div class="header-bottom"
       [class.open]="isMenuOpen">

    <div class="container">

      <ul class="category-nav">
        <li *ngFor="let category of categories">
          <a
            [routerLink]="['/shop', category]"
            (click)="closeMenu()">
            {{ category }}
          </a>
        </li>
      </ul>

    </div>
  </div>

</header>
