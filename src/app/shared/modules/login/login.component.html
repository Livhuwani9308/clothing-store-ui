<div class="container-fluid vh-100">
    <div class="row h-100">
      <div class="col-md-6 d-none d-md-block p-0">
        <img
          src="assets/login-image.jpg"
          alt="Login Image"
          class="w-100 h-100"
          style="object-fit: cover"
        />
      </div>
  
      <div class="col-md-6 d-flex flex-column justify-content-center align-items-center px-4">
        
        <div class="w-75">
          <img src="assets/logo.png" alt="Logo" class="logo" />

          <h1>{{ isAdminPortal ? 'Admin Portal' : 'Hello and Welcome' }}</h1>
  
          <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" class="mt-3" autocomplete="off">
  
            <div class="mb-4">
              <label for="email">Email Address <span class="em-required-icon">*</span></label>
              <div class="position-relative">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  id="email"
                  type="email"
                  name="email"
                  [(ngModel)]="model.email"
                  class="form-control border-0 border-bottom input-field"
                  required
                  #email="ngModel"
                  placeholder="Email Address"
                  pattern="^[a-zA-Z0-9@.]+$"
                />
              </div>
              <!-- <div class="text-danger" *ngIf="email.invalid && email.touched">Email is required.</div> -->
              <div class="text-danger" *ngIf="email.invalid && email.touched">
                <div *ngIf="email.errors?.['required']">Email is required.</div>
                <div *ngIf="email.errors?.['pattern']">Special characters not allowed</div>
              </div>
            </div>
  
            <div class="mb-3">
              <label for="password">Password <span class="em-required-icon">*</span></label>
              <div class="position-relative">
                <i class="fas fa-lock input-icon"></i>
                <input
                  id="password"
                  [type]="passwordFieldType"
                  [(ngModel)]="model.password"
                  name="password"
                  class="form-control border-0 border-bottom input-field"
                  required
                  #password="ngModel"
                  placeholder="Password"
                />
                <i
                  *ngIf="passwordFieldType === 'password'"
                  class="far fa-eye-slash eye-hide"
                  (click)="togglePasswordVisibility()"
                  aria-hidden="true"
                ></i>
                <i
                  *ngIf="passwordFieldType === 'text'"
                  class="far fa-eye eye-show"
                  (click)="togglePasswordVisibility()"
                  aria-hidden="true"
                ></i>
              </div>
              <div class="text-danger" *ngIf="password.invalid && password.touched">Password is required.</div>
            </div>
  
            <button type="submit" class="btn btn-primary w-100 mt-3">
              Login
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
